<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" as="image" href="splash.png">
  <link rel="stylesheet" href="style.css">
  <title>Digital Album</title>
</head>
<body class="splash-active">
  <div id="splashScreen" class="splash-screen" role="presentation" aria-hidden="true">
    <img id="splashImage" class="splash-image" src="splash.png" alt="">
    <div class="splash-copyright">© TOTISMAGISTIS/STRANGE MATTER COMICS</div>
  </div>

  <header class="topbar">
    <div>
      <div class="eyebrow">DIGITAL ALBUM · ENCRYPTED</div>
      <div class="progress"><strong id="ownedCount">0</strong> / 20 UNLOCKED</div>
    </div>
    <button id="scanQr" class="scan-qr" type="button">SCAN QR</button>
  </header>

  <main id="albumGrid" class="album-grid" aria-label="20-card album"></main>

  <dialog id="gallery" aria-label="Card gallery">
    <div class="gallery-head">
      <button id="closeGallery" type="button" aria-label="Close gallery">×</button>
      <div id="galleryPosition"></div>
      <span aria-hidden="true"></span>
    </div>
    <div id="galleryTrack" class="gallery-track" tabindex="0" aria-label="Swipe horizontally through cards"></div>
    <div id="galleryMeta" class="gallery-meta"></div>
  </dialog>

  <dialog id="qrScanner" class="qr-scanner" aria-label="QR scanner">
    <div class="qr-scanner-head">
      <button id="closeQrScanner" type="button" aria-label="Close QR scanner">×</button>
      <strong>FRAME THE QR CODE</strong>
      <span aria-hidden="true"></span>
    </div>
    <div class="qr-camera">
      <video id="qrVideo" playsinline muted></video>
      <div class="qr-reticle" aria-hidden="true"></div>
    </div>
    <div id="qrStatus" class="qr-status">STARTING CAMERA…</div>
  </dialog>

  <div id="revealBar" class="reveal-overlay" role="dialog" aria-modal="true" aria-label="Card reveal" hidden>
    <div class="reveal-stage">
      <div id="revealCard" class="reveal-card" aria-hidden="true">
        <img id="revealPreviewImage" class="reveal-preview-image" alt="">
        <img id="revealFullImage" class="reveal-full-image" alt="">
        <div class="reveal-encrypted">
          <strong>DECRYPTING</strong>
          <span>AD1 / SECURE CARD</span>
        </div>
        <div class="reveal-grid" aria-hidden="true"></div>
        <div class="reveal-scan" aria-hidden="true"></div>
        <div class="reveal-glitch reveal-glitch-one" aria-hidden="true"></div>
        <div class="reveal-glitch reveal-glitch-two" aria-hidden="true"></div>
        <div class="reveal-flash" aria-hidden="true"></div>
      </div>
      <div class="reveal-unlocked" aria-hidden="true">CARD UNLOCKED</div>
    </div>
    <div id="revealText" class="reveal-text" aria-live="polite">UNLOCKING</div>
    <button id="skipReveal" class="skip-reveal" type="button">SKIP</button>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
