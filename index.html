<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=20260826-ui4">
  <title>Album Digitale</title>
</head>
<body>
  <header class="topbar">
    <div><div class="eyebrow">ALBUM DIGITALE · CIFRATO</div><div class="progress"><strong id="ownedCount">0</strong> / 20 SBLOCCATE</div></div>
    <button id="scanQr" type="button">SCANSIONA QR</button>
    <button id="testQr" type="button">TEST QR</button>
  </header>

  <main id="albumGrid" class="album-grid" aria-label="Album di 20 card"></main>

  <dialog id="qrDialog">
    <div class="dialog-head"><strong>QR DI TEST</strong><button id="closeQr" type="button" aria-label="Chiudi">×</button></div>
    <p>I QR demo sono firmati digitalmente. Il terzo test altera il payload senza una firma valida e deve essere rifiutato.</p>
    <button class="qr-sim" id="qrA" type="button">QR A · 5 CARD</button>
    <button class="qr-sim" id="qrB" type="button">QR B · 5 CARD</button>
    <button class="qr-sim" id="qrFake" type="button">TEST QR FALSO · DEVE FALLIRE</button>
    <button id="resetDemo" class="secondary" type="button">RESET DEMO</button>
  </dialog>


  <dialog id="scannerDialog" aria-label="Scanner QR">
    <div class="dialog-head"><strong>SCANSIONA QR</strong><button id="closeScanner" type="button" aria-label="Chiudi scanner">×</button></div>
    <div class="scanner-stage"><video id="scannerVideo" playsinline muted></video><div class="scanner-frame" aria-hidden="true"></div></div>
    <p id="scannerStatus">Inquadra il QR firmato all'interno del riquadro.</p>
  </dialog>

  <dialog id="gallery" aria-label="Galleria card">
    <div class="gallery-head">
      <button id="closeGallery" type="button" aria-label="Chiudi galleria">×</button>
      <div id="galleryPosition"></div>
      <span aria-hidden="true"></span>
    </div>
    <div id="galleryTrack" class="gallery-track" tabindex="0" aria-label="Scorri orizzontalmente le card"></div>
    <div id="galleryMeta" class="gallery-meta"></div>
  </dialog>

  <div id="revealBar" class="reveal-bar" hidden><span id="revealText">SBLOCCO IN CORSO</span><button id="skipReveal" type="button">SALTA</button></div>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js?v=20260826-ui4"></script>
</body>
</html>
